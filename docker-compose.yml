services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bird-app
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=laravel
      - APP_ENV=testing
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    shm_size: '256mb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    depends_on:
      - mysql
    networks:
      - bird

  nginx:
    image: nginx:1.25-alpine
    container_name: bird-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bird

  mysql:
    image: mysql:8.0
    container_name: bird-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: bird
      MYSQL_USER: bird
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - bird-db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - bird

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bird-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: bird
      PMA_PASSWORD: secret
      PMA_DB: bird_test
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - bird

volumes:
  bird-db-data:

networks:
  bird:

