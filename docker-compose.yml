services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bird-app
    working_dir: /var/www/html/app
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_IDE_CONFIG=serverName=laravel
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=bird
      - DB_USERNAME=bird
      - DB_PASSWORD=secret
      - CACHE_STORE=file
    depends_on:
      - mysql
    networks:
      - bird

  nginx:
    image: nginx:1.25-alpine
    container_name: bird-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bird

  mysql:
    image: mysql:8.0
    container_name: bird-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: bird
      MYSQL_USER: bird
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - bird-db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - bird

volumes:
  bird-db-data:

networks:
  bird:

