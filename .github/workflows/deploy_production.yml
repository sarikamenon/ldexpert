name: LD-Expert Nova Production Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Deploy Code to Server
      env:
        SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        SSH_USER: ${{ secrets.PROD_SSH_USER }}
        SERVER_IP: ${{ secrets.PROD_SERVER_IP }}
      run: |
        # Configure SSH
        mkdir -p ~/.ssh
        touch ~/.ssh/known_hosts
        echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keygen -R $SERVER_IP
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

        # Run deployment script
        ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SERVER_IP 'bash -l -c "./deploy_prod_nova.sh"'
        pwd
