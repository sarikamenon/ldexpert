# QA automation — Stage 2: generate tests, run them, report.
#
# Fires when an approved scenarios PR (label: qa-scenarios) is merged. Generates
# the Dusk tests from the approved Excel, AI-reviews them, runs them in bird_test
# (CI container — never a shared DB), self-heals locator failures once, builds a
# report, and opens PR #2 with the tests + report for final review.
#
# DORMANT until QA_AUTOMATION_ENABLED=true AND secret CLAUDE_CODE_OAUTH_TOKEN set.
# See .github/QA_AUTOMATION_SETUP.md.
name: QA Stage 2 - Generate + Run + Report

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-run-report:
    # Only when a qa-scenarios PR was actually merged (not just closed).
    if: >-
      ${{ vars.QA_AUTOMATION_ENABLED == 'true'
      && github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'qa-scenarios') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: testing
    steps:
      - name: Checkout main (approved scenarios)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node (for Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate + review tests with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude -p "/qa-generate-tests
          Only write PHP under app/tests/BrowserQA/ — never touch app code or
          developers' tests (Unit/Feature/Browser). Use the Qa* prefix." \
            --permission-mode acceptEdits
          claude -p "/qa-review-tests app/tests/BrowserQA/" --permission-mode acceptEdits

      - name: Guard — QA files only (block if dev code touched)
        run: |
          set -euo pipefail
          OFFENDERS="$(git diff --name-only | grep -vE '^(app/tests/BrowserQA/|qa/)' || true)"
          if [ -n "${OFFENDERS}" ]; then
            echo "❌ BLOCKED: test generation changed non-QA files:"; echo "${OFFENDERS}"
            exit 1
          fi
          echo "✓ Only QA files changed."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start application stack
        run: docker compose up -d --build

      # run-browser-qa.sh installs deps, forces DB_DATABASE=bird_test, hard-aborts
      # if the DB is not bird_test, runs the suite, and builds JUnit + HTML report.
      - name: Run BrowserQA in bird_test and build report
        id: run1
        continue-on-error: true
        run: bash scripts/ci/run-browser-qa.sh

      # Self-heal: if the run failed, let Claude fix locator/timeout issues once,
      # then re-run. Real app bugs (not locator issues) will still fail and surface.
      - name: Self-heal locator/timeout failures (one pass)
        if: steps.run1.outcome == 'failure'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          claude -p "/qa-review-tests app/tests/BrowserQA/
          The last run failed. Inspect failures in app/tests/ci-reports and the
          screenshots in app/tests/BrowserQA/screenshots. Fix ONLY locator/selector
          and timeout/wait issues in the Qa* test files. Do NOT mask a real app bug
          and do NOT touch app code." --permission-mode acceptEdits

      - name: Re-run after self-heal
        if: steps.run1.outcome == 'failure'
        run: bash scripts/ci/run-browser-qa.sh

      - name: Guard — QA files only (after self-heal)
        if: steps.run1.outcome == 'failure'
        run: |
          set -euo pipefail
          OFFENDERS="$(git diff --name-only | grep -vE '^(app/tests/BrowserQA/|qa/)' || true)"
          if [ -n "${OFFENDERS}" ]; then
            echo "❌ BLOCKED: self-heal changed non-QA files:"; echo "${OFFENDERS}"; exit 1
          fi

      - name: Open PR #2 (tests + report)
        if: always()
        uses: peter-evans/create-pull-request@v6
        with:
          branch: qa/tests-${{ github.run_id }}
          base: main
          title: "QA tests + report for ${{ github.sha }}"
          labels: qa-tests
          reviewers: ${{ vars.QA_REVIEWER }}
          commit-message: "QA: generated tests + report for ${{ github.sha }}"
          body: |
            Automated **Stage 2** — generated Dusk tests and ran them in `bird_test`.

            **Review the report** (`app/tests/ci-reports/dusk-report.html`, attached
            as a build artifact below).

            - ✅ All green → approve & merge — tests become permanent.
            - ❌ Failures → check the report/screenshot:
              - locator/timeout → comment `@claude fix TC-xxx` (or fix locally, push)
              - real app bug → ask the developer to fix the feature; do not merge

            > Tests live only under `app/tests/BrowserQA/`. No app code was touched.

      - name: Upload report + JUnit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-stage2-report
          path: |
            app/tests/ci-reports/dusk-report.html
            app/tests/ci-reports/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Email reviewer
        if: always() && vars.QA_NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "QA tests run — report ready for ${{ github.sha }}"
          to: ${{ vars.QA_NOTIFY_EMAIL }}
          from: QA Automation <develop.ldexpert@gmail.com>
          html_body: "Stage 2 generated and ran the tests. Review the report PR and merge when green."

      - name: Stop stack
        if: always()
        run: docker compose down -v
