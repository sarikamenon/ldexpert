name: Browser QA (Dusk)

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

concurrency:
  group: browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    name: BrowserQA Dusk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The QA suite needs the served app (FPM) in testing mode so it uses
    # .env.testing -> bird_test. docker-compose defaults APP_ENV to local for
    # dev; CI opts into testing here so every docker compose command inherits it.
    env:
      APP_ENV: testing

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start application stack
        run: docker compose up -d --build

      # NOTE: We do NOT wait for the app to be "ready" here — the app cannot serve
      # requests until run-browser-qa.sh installs Composer dependencies (vendor/).
      # That script installs deps, restarts the app container, then waits for readiness.
      - name: Run BrowserQA suite and build HTML report
        run: bash scripts/ci/run-browser-qa.sh

      # No SMTP sender needed: the HTML report is uploaded as the artifact below,
      # and GitHub notifies watchers / the run owner. Run summary links it here.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Daily Browser QA report — Run #${{ github.run_number }}"
            echo ""
            echo "Status: **${{ job.status }}**"
            echo ""
            echo "Download the full HTML report from the **Artifacts** section of this run"
            echo "(\`browserqa-dusk-html-report\`)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Dusk HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserqa-dusk-html-report
          path: app/tests/ci-reports/dusk-report.html
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserqa-dusk-junit
          path: app/tests/ci-reports/junit.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browserqa-dusk-screenshots
          path: app/tests/BrowserQA/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop stack
        if: always()
        run: docker compose down -v
