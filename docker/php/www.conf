[www]
; Running as www-data user (configured in Dockerfile)
user = www-data
group = www-data

; Basic pool configuration
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process management
pm = dynamic
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Error logging
php_flag[display_errors] = on
php_admin_value[error_log] = /var/www/html/app/storage/logs/php-fpm-error.log
php_admin_flag[log_errors] = on
